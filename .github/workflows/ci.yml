name: CI — repository validation (no execution or deploy)

on:
  push:
    branches:
      - main
      - develop
      - chore/remove-legacy-scenarios
      - docs/jev-security-scenarios
      - chore/scenario-guides
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser for static validation
        run: python -m pip install "PyYAML==6.0.2"
      - name: Check tracked source, configuration and local document links
        run: python .github/scripts/check_repository.py
      - name: Check whitespace in the published commit
        run: git show --format= --check HEAD
